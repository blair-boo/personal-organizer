name: Backup (Supabase -> Cloudflare R2)

# Todo domingo. Banco: 4 semanais + 4 mensais (primeiro domingo do mês). Arquivos
# do Storage: espelho incremental, com limpeza do que saiu do Supabase em
# janeiro e julho. Detalhes e layout em scripts/backup-supabase.mjs e no README.
# O agendamento só roda na branch padrão do repositório.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'personal-organizer-backup' }}
      # rclone configurado só por variáveis (sem arquivo de config).
      # NO_CHECK_BUCKET: o token do R2 é restrito a este bucket e não pode criá-lo.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_S3_NO_CHECK_BUCKET: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Backup
        run: node scripts/backup-supabase.mjs

      # Lê de volta do R2 o backup que acabou de ser gravado e confere a
      # integridade (JSON legível e contagem de linhas igual à do manifest).
      # Se falhar, o workflow fica vermelho e o GitHub avisa por e-mail.
      - name: Verificar backup gravado
        run: node scripts/restaurar-supabase.mjs --verificar
